# Online rooms for Untitled Disc Game (server/src/index.ts). Deploy: npm run server:deploy
name = "untitled-disc-game-rooms"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# Free plan: Durable Objects must use the SQLite storage backend.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
