# Check everything, then publish: the rooms Worker (when server/ changed) and the game on GitHub
# Pages, on every push to main.
#
# One-time setup:
# - Settings → Pages → Build and deployment → Source: GitHub Actions.
# - Settings → Secrets and variables → Actions:
#   - Variable ROOMS_URL: the rooms Worker (wss://…workers.dev). Without it, "Play online" stays hidden.
#   - Secrets CLOUDFLARE_API_TOKEN (the "Edit Cloudflare Workers" template) and CLOUDFLARE_ACCOUNT_ID,
#     for deploying the Worker. Without them the Worker isn't deployed (a warning says so).
name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_server:
        description: Deploy the rooms Worker too
        type: boolean
        default: false

permissions:
  contents: read
  actions: read # to find the last successful run (see "Did the room server change")

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('check-{0}', github.ref) || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.changes.outputs.server }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # history, to compare server/ with the last successful run
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck (game and room server)
        run: npm run typecheck
      - run: npm test
      - name: Room server protocol tests (against wrangler dev)
        run: npm run test:rooms
        env:
          WRANGLER_SEND_METRICS: 'false'
      # Against the last successful run on main, not just this push: a Worker deploy that failed
      # (or never ran) is tried again on the next push until one goes through.
      - name: Did the room server change since the last successful run?
        if: github.event_name == 'push'
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --branch main --status success --limit 1 --json headSha -q '.[0].headSha // empty')
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null && git diff --quiet "$base" HEAD -- server/; then
            echo "server=false" >> "$GITHUB_OUTPUT"
          else
            echo "server=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Compared server/ with ${base:-nothing (no successful run yet)}"

  # The Worker goes first: the game speaks to older room servers, but a new room feature is only
  # there once the Worker is.
  deploy-server:
    needs: check
    if: github.event_name != 'pull_request' && (needs.check.outputs.server == 'true' || inputs.deploy_server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Deploy the rooms Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          # A pasted secret can carry stray spaces or a newline, which wrangler refuses.
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN isn't set: the rooms Worker wasn't deployed (npm run server:deploy by hand)."
            exit 0
          fi
          npm run server:deploy

  build:
    needs: [check, deploy-server]
    # Runs when the Worker deployed or had nothing to deploy, never after a failed deploy.
    if: always() && github.event_name != 'pull_request' && needs.check.result == 'success' && needs.deploy-server.result != 'failure' && needs.deploy-server.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_ROOMS_URL: ${{ vars.ROOMS_URL }}
          VITE_ESRI_IMAGERY: 'on'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
